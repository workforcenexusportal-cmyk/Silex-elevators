<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silex — Something Big Is Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --gold:#bcc6d8; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#02060f; overflow:hidden; font-family:Inter,"Segoe UI",Arial,sans-serif; }
  .stage { position:fixed; inset:0; display:grid; place-items:center; }
  canvas { max-width:100vw; max-height:100vh; box-shadow:0 40px 120px -30px rgba(0,0,0,.8); border-radius:6px; }
  .bar { position:fixed; top:16px; left:50%; transform:translateX(-50%); z-index:10;
         display:flex; gap:12px; align-items:center; padding:10px 14px; border-radius:999px;
         background:rgba(10,20,44,.72); border:1px solid rgba(255,255,255,.12);
         backdrop-filter:blur(12px); color:#e9edf6; font-size:14px; }
  .bar b { font-weight:600; letter-spacing:.02em; }
  .btn { cursor:pointer; border:0; padding:9px 16px; border-radius:999px; font-weight:700; font-size:14px;
         color:#06122e; background:linear-gradient(135deg,#e9edf5,#8f9bb2); transition:transform .2s; }
  .btn:hover { transform:translateY(-2px); }
  .btn[disabled] { opacity:.5; cursor:default; transform:none; }
  .dot { width:9px; height:9px; border-radius:50%; background:#35d07f; box-shadow:0 0 8px #35d07f; }
  .dot.rec { background:#ff4d4d; box-shadow:0 0 10px #ff4d4d; animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  .hint { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:10;
          color:#7f8aa3; font-size:12.5px; letter-spacing:.02em; }
</style>
</head>

  // particles for depth
  const P = [];
  for (let i = 0; i < 46; i++) {
    P.push({ x:Math.random()*W, y:Math.random()*H, r:Math.random()*2.2+0.6,
             sp:Math.random()*10+4, ph:Math.random()*6.28 });
  }

  const clamp = (x,a=0,b=1) => Math.max(a, Math.min(b, x));
  const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
  const easeIO  = x => (x<.5) ? 4*x*x*x : 1 - Math.pow(-2*x+2,3)/2;
  const smooth  = (a,b,x) => easeIO(clamp((x-a)/(b-a)));

  function platinum(x0,y0,x1,y1){
    const g = ctx.createLinearGradient(x0,y0,x1,y1);
    g.addColorStop(0,'#f6f9ff'); g.addColorStop(.5,'#c8d0de'); g.addColorStop(1,'#8f9bb2');
    return g;
  }

  // horizontal safe area for Instagram story (keeps letters off the edges)
  const MARGIN = 96;
  const MAXW = W - MARGIN*2;

  function drawText(txt, y, size, weight, color, spacing, alpha, glow, maxW){
    if (alpha <= 0) return;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    try { ctx.letterSpacing = spacing + 'px'; } catch(e) {}
    const limit = maxW || MAXW;
    let fs = size;
    ctx.font = weight + ' ' + fs + 'px Sora, "Segoe UI", Arial, sans-serif';
    let width = ctx.measureText(txt).width;
    if (width > limit) {
      fs = Math.floor(fs * limit / width);
      ctx.font = weight + ' ' + fs + 'px Sora, "Segoe UI", Arial, sans-serif';
    }
    if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 42 * alpha; }
    ctx.fillStyle = (typeof color === 'string') ? color : color();
    ctx.fillText(txt, CX, y);
    ctx.restore();
  }

  function frame(t){
    // ---- background: dark blue from the very first frame (no blank/black start) ----
    const bg = 0.92 + 0.08*smooth(0, 1.6, t);
    ctx.fillStyle = '#040c22';
    ctx.fillRect(0,0,W,H);

    const pulse = 0.5 + 0.5*Math.sin((t-4)*0.9);
    const glowA = 0.55*bg + 0.12*bg*pulse;
    let g = ctx.createRadialGradient(CX, H*0.44, 0, CX, H*0.44, H*0.72);
    g.addColorStop(0, 'rgba(26,52,112,'+glowA+')');
    g.addColorStop(0.5, 'rgba(12,28,66,'+(0.34*bg)+')');
    g.addColorStop(1, 'rgba(3,10,36,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    let lg = ctx.createLinearGradient(0, H*0.5, 0, H);
    lg.addColorStop(0, 'rgba(6,14,40,0)');
    lg.addColorStop(1, 'rgba(10,23,56,'+(0.55*bg)+')');
    ctx.fillStyle = lg; ctx.fillRect(0,0,W,H);

    // ---- particles ----
    for (const p of P){
      p.y -= p.sp * 0.016;
      if (p.y < -5) { p.y = H+5; p.x = Math.random()*W; }
      const a = (0.35 + 0.35*Math.sin(t*1.5 + p.ph)) * bg;
      ctx.fillStyle = 'rgba(190,201,224,'+(a*0.5)+')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
    }

    // ---- headline ----
    const a1 = easeOut((t-0.3)/1.2);
    drawText('SOMETHING BIG', 560 + (1-a1)*34, 118, '800',
             () => platinum(CX-360, 500, CX+360, 620), 4, a1, 'rgba(120,150,210,0.5)');

    const a2 = easeOut((t-1.8)/1.2);
    drawText('IS COMING SOON', 700 + (1-a2)*22, 58, '700', '#aab6cd', 14, a2, null);

    // ---- logo ----
    if (logoReady){
      const la = easeOut((t-3.4)/1.5);
      if (la > 0){
        const scale = 0.74 + 0.26*la;
        const h = 500 * scale, w = h * logoAR;
        const ly = 1140;
        ctx.save();
        ctx.globalAlpha = la;
        ctx.shadowColor = 'rgba(70,120,210,0.55)';
        ctx.shadowBlur = 80 * la;
        ctx.drawImage(logo, CX - w/2, ly - h/2, w, h);
        ctx.restore();
      }
    }

    // ---- wordmark ----
    const wa = easeOut((t-5.6)/1.3);
    drawText('SILEX ELEVATOR PVT. LTD', 1500 + (1-wa)*18, 58, '700',
             () => platinum(CX-360, 1470, CX+360, 1530), 2, wa, 'rgba(120,150,210,0.35)');
    drawText('PREMIUM ELEVATORS', 1566 + (1-wa)*10, 30, '600', '#8f9bb2', 12, wa, null);

    // ---- shimmer sweep ----
    const ss = clamp((t-6.8)/2.8);
    if (ss > 0 && ss < 1){
      const x = -300 + ss*(W+600);
      const sg = ctx.createLinearGradient(x-170, 0, x+170, 0);
      sg.addColorStop(0, 'rgba(255,255,255,0)');
      sg.addColorStop(0.5, 'rgba(255,255,255,0.16)');
      sg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = sg;
      ctx.fillRect(0, 420, W, 1180);
      ctx.restore();
    }

    // ---- vignette ----
    let v = ctx.createRadialGradient(CX, H*0.5, H*0.32, CX, H*0.5, H*0.78);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = v; ctx.fillRect(0,0,W,H);
  }

  // ---- clock + loop ----
  let origin = performance.now();
  let recording = false;
  function tick(now){
    let t = (now - origin) / 1000;
    if (!recording && t > DURATION + 0.8){ origin = now; t = 0; }
    frame(t);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ---- recording ----
  const recBtn = document.getElementById('rec');
  const statusEl = document.getElementById('status');
  const dot = document.getElementById('dot');

  function pickMime(){
    const c = ['video/mp4;codecs=avc1.42E01E','video/mp4',
               'video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
    for (const m of c){ if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m; }
    return '';
  }

  function download(blob, ext){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'silex-coming-soon.' + ext;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  function record(){
    if (recording) return;
    const mime = pickMime();
    if (!mime){ alert('Your browser cannot record video. Use Chrome or Edge.'); return; }
    recording = true;
    origin = performance.now();          // restart animation at t=0 for the capture
    recBtn.disabled = true;
    dot.classList.add('rec');
    const ext = mime.indexOf('mp4') >= 0 ? 'mp4' : 'webm';
    const stream = canvas.captureStream(60);
    const chunks = [];
    const rec = new MediaRecorder(stream, { mimeType:mime, videoBitsPerSecond: 12000000 });
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      const blob = new Blob(chunks, { type:mime });
      download(blob, ext);
      window.__videoB64 = null; window.__videoExt = ext;
      const fr = new FileReader();
      fr.onload = () => { window.__videoB64 = String(fr.result).split(',')[1]; };
      fr.readAsDataURL(blob);
      recording = false;
      recBtn.disabled = false;
      dot.classList.remove('rec');
      statusEl.textContent = 'Saved silex-coming-soon.' + ext;
      setTimeout(() => statusEl.textContent = 'Preview looping', 4000);
    };
    let left = Math.ceil(DURATION);
    statusEl.textContent = 'Recording… ' + left + 's';
    const iv = setInterval(() => { left--; if (left>0) statusEl.textContent = 'Recording… ' + left + 's'; }, 1000);
    rec.start();
    setTimeout(() => { clearInterval(iv); rec.stop(); }, DURATION * 1000);
  }

  recBtn.addEventListener('click', record);
  window.addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') record(); });
})();
</script>
