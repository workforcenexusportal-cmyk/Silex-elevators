{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block title %}Slow down a moment{% endblock %}

{% block content %}
<section class="page-head" style="min-height:70vh;display:grid;align-items:center">
  <div class="container page-head__inner center" style="text-align:center">
    <div style="font-family:var(--display);font-size:clamp(4rem,14vw,9rem);font-weight:800;color:var(--gold-lt);line-height:1">429</div>
    <h1 style="margin-top:0">Too many requests</h1>
    <p style="margin-inline:auto">You've made a lot of requests in a short time. Please wait a moment and try again.</p>
    <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:28px">
      <a href="{{ url_for('home') }}" class="btn btn--gold">Back to Home {{ icon('arrow') }}</a>
    </div>
  </div>
</section>
{% endblock %}
