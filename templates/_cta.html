{% from "_icons.html" import icon %}
<section class="cta">
  <div class="cta__glow"></div>
  <div class="container cta__inner">
    <div>
      <span class="eyebrow">Ready when you are</span>
      <h2>Let's plan the perfect elevator for your building.</h2>
    </div>
    <div style="display:flex;gap:14px;flex-wrap:wrap">
      <a href="{{ url_for('contact') }}" class="btn btn--gold">Get a Free Quote {{ icon('arrow') }}</a>
      <a href="tel:{{ cfg.PHONE|replace(' ','') }}" class="btn btn--ghost">{{ icon('phone') }} {{ cfg.PHONE }}</a>
    </div>
  </div>
</section>
